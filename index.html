<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Việt</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#071321;
  color:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:28px;
}

header{
  padding:22px 0 26px;
  border-bottom:1px solid #1d2c3e;
}

.logo{
  font-size:42px;
  font-weight:800;
}

.logo span{
  color:#4fc59d;
}

.subtitle{
  color:#8798ac;
  margin-top:8px;
  font-size:20px;
}

.tabs{
  display:flex;
  background:#101e2d;
  padding:7px;
  border-radius:22px;
  margin:30px 0;
}

.tab{
  width:50%;
  border:0;
  padding:18px 10px;
  border-radius:17px;
  background:transparent;
  color:#8999ad;
  font-size:22px;
  font-weight:700;
}

.tab.active{
  background:#22364f;
  color:white;
}

.indexes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:28px;
}

.index-card{
  background:#111f2f;
  border-radius:20px;
  padding:18px 15px;
}

.index-name{
  color:#91a0b4;
  font-size:16px;
}

.index-price{
  font-size:23px;
  font-weight:750;
  margin-top:8px;
}

.green{
  color:#42d3a5;
}

.red{
  color:#ff6471;
}

.waiting{
  color:#8798ac;
  font-size:14px;
  margin-top:4px;
}

.chart-card{
  background:#111f2f;
  padding:25px;
  border-radius:24px;
  margin-bottom:30px;
}

.chart-symbol{
  font-size:25px;
  font-weight:750;
}

.bigprice{
  font-size:43px;
  font-weight:800;
  margin-top:10px;
}

.bigchange{
  font-size:27px;
  margin-top:5px;
}

.timeframes{
  display:flex;
  gap:10px;
  margin:25px 0 14px;
}

.timeframes button{
  border:0;
  background:#17283c;
  color:#98a6b8;
  padding:12px 17px;
  border-radius:12px;
  font-size:17px;
}

.timeframes button.active{
  background:#304c6d;
  color:white;
}

#chartArea{
  width:100%;
  height:420px;
  overflow:hidden;
  border-radius:4px;
}

.search{
  width:100%;
  border:1px solid #31455e;
  background:#091625;
  color:white;
  padding:19px 20px;
  border-radius:18px;
  font-size:19px;
  outline:none;
  margin-bottom:25px;
}

.title{
  font-size:28px;
  font-weight:800;
  margin:15px 0;
}

.market-row{
  display:grid;
  grid-template-columns:70px 1fr auto;
  align-items:center;
  gap:12px;
  padding:22px 5px;
  border-bottom:1px solid #1d3044;
  cursor:pointer;
}

.coin-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#172b42;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:800;
}

.market-symbol{
  font-size:21px;
  font-weight:750;
}

.market-name{
  color:#8c9caf;
  font-size:17px;
  margin-top:5px;
}

.market-right{
  text-align:right;
}

.market-price{
  font-size:21px;
  font-weight:750;
}

.market-change{
  margin-top:5px;
  font-size:18px;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#718297;
  padding:35px 0 50px;
  font-size:14px;
}

@media(max-width:600px){

  .container{
    padding:20px 16px;
  }

  .logo{
    font-size:35px;
  }

  .subtitle{
    font-size:17px;
  }

  .tab{
    font-size:19px;
  }

  .indexes{
    gap:8px;
  }

  .index-card{
    padding:15px 10px;
  }

  .index-name{
    font-size:13px;
  }

  .index-price{
    font-size:18px;
  }

  .chart-card{
    padding:18px 14px;
  }

  .bigprice{
    font-size:38px;
  }

  #chartArea{
    height:390px;
  }

  .market-row{
    grid-template-columns:55px 1fr auto;
  }

  .coin-icon{
    width:48px;
    height:48px;
  }

  .market-symbol{
    font-size:18px;
  }

  .market-price{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">Stock <span>Việt</span></div>
  <div class="subtitle">Thị trường chứng khoán & tài sản số</div>
</header>

<div class="tabs">
  <button class="tab" id="stockTab" onclick="showStocks()">
    Chứng khoán
  </button>

  <button class="tab active" id="cryptoTab" onclick="showCrypto()">
    Crypto
  </button>
</div>

<div class="indexes">

  <div class="index-card">
    <div class="index-name">VN-INDEX</div>
    <div class="index-price">--</div>
    <div class="waiting">Chờ dữ liệu</div>
  </div>

  <div class="index-card">
    <div class="index-name">HNX-INDEX</div>
    <div class="index-price">--</div>
    <div class="waiting">Chờ dữ liệu</div>
  </div>

  <div class="index-card">
    <div class="index-name">UPCOM</div>
    <div class="index-price">--</div>
    <div class="waiting">Chờ dữ liệu</div>
  </div>

</div>

<div class="chart-card">

  <div id="chartSymbol" class="chart-symbol">
    BTC / USDT
  </div>

  <div id="chartPrice" class="bigprice">
    Đang tải...
  </div>

  <div id="chartChange" class="bigchange green">
    --
  </div>

  <div class="timeframes">
    <button>1H</button>
    <button>4H</button>
    <button class="active">1D</button>
    <button>1W</button>
  </div>

  <div id="chartArea"></div>

</div>

<input
  class="search"
  id="search"
  placeholder="Tìm Bitcoin, Ethereum, FPT, VCB..."
>

<div id="cryptoSection">

  <div class="title">Thị trường Crypto</div>

  <div id="cryptoList"></div>

</div>

<div id="stockSection" class="hidden">

  <div class="title">Chứng khoán Việt Nam</div>

  <div id="stockList"></div>

</div>

<div class="footer">
  Stock Việt • Theo dõi thị trường
</div>

</div>


<script>

const cryptoCoins = [

{
 id:"bitcoin",
 symbol:"BTC",
 name:"Bitcoin",
 tv:"BINANCE:BTCUSDT"
},

{
 id:"ethereum",
 symbol:"ETH",
 name:"Ethereum",
 tv:"BINANCE:ETHUSDT"
},

{
 id:"binancecoin",
 symbol:"BNB",
 name:"BNB",
 tv:"BINANCE:BNBUSDT"
},

{
 id:"solana",
 symbol:"SOL",
 name:"Solana",
 tv:"BINANCE:SOLUSDT"
},

{
 id:"ripple",
 symbol:"XRP",
 name:"XRP",
 tv:"BINANCE:XRPUSDT"
},

{
 id:"dogecoin",
 symbol:"DOGE",
 name:"Dogecoin",
 tv:"BINANCE:DOGEUSDT"
}

];


const stocks = [

{
 symbol:"FPT",
 name:"FPT Corporation",
 price:0,
 change:0
},

{
 symbol:"VCB",
 name:"Vietcombank",
 price:0,
 change:0
},

{
 symbol:"HPG",
 name:"Hòa Phát",
 price:0,
 change:0
},

{
 symbol:"VIC",
 name:"Vingroup",
 price:0,
 change:0
},

{
 symbol:"VNM",
 name:"Vinamilk",
 price:0,
 change:0
},

{
 symbol:"MWG",
 name:"Thế Giới Di Động",
 price:0,
 change:0
},

{
 symbol:"SSI",
 name:"Chứng khoán SSI",
 price:0,
 change:0
},

{
 symbol:"VHM",
 name:"Vinhomes",
 price:0,
 change:0
}

];


let currentMode="crypto";

let cryptoData=[];


function money(n){

 if(n===undefined || n===null){
  return "--";
 }

 if(n<1){
  return "$"+Number(n).toFixed(4);
 }

 return "$"+Number(n).toLocaleString(
  "en-US",
  {
   maximumFractionDigits:2
  }
 );

}


function percent(n){

 if(n===undefined || n===null){
  return "--";
 }

 return (n>=0?"+":"")+Number(n).toFixed(2)+"%";

}


function renderCrypto(){

 const list=document.getElementById("cryptoList");

 list.innerHTML="";

 cryptoData.forEach(c=>{

  const row=document.createElement("div");

  row.className="market-row";

  row.innerHTML=`

   <div class="coin-icon">
    ${c.symbol.charAt(0)}
   </div>

   <div>
    <div class="market-symbol">
     ${c.symbol}/USDT
    </div>

    <div class="market-name">
     ${c.name}
    </div>
   </div>

   <div class="market-right">

    <div class="market-price">
     ${money(c.price)}
    </div>

    <div class="market-change ${c.change>=0?"green":"red"}">
     ${percent(c.change)}
    </div>

   </div>

  `;

  row.onclick=()=>selectCrypto(c);

  list.appendChild(row);

 });

}


function renderStocks(data=stocks){

 const list=document.getElementById("stockList");

 list.innerHTML="";

 data.forEach(s=>{

  const row=document.createElement("div");

  row.className="market-row";

  row.innerHTML=`

   <div class="coin-icon">
    ${s.symbol.charAt(0)}
   </div>

   <div>

    <div class="market-symbol">
     ${s.symbol}
    </div>

    <div class="market-name">
     ${s.name}
    </div>

   </div>

   <div class="market-right">

    <div class="market-price">
     --
    </div>

    <div class="market-name">
     Chờ dữ liệu
    </div>

   </div>

  `;

  row.onclick=()=>selectStock(s);

  list.appendChild(row);

 });

}


async function loadCrypto(){

 try{

  const ids=cryptoCoins
   .map(c=>c.id)
   .join(",");

  const url=
  "https://api.coingecko.com/api/v3/simple/price"+
  "?ids="+ids+
  "&vs_currencies=usd"+
  "&include_24hr_change=true";

  const response=await fetch(url);

  if(!response.ok){
   throw new Error("Không lấy được dữ liệu");
  }

  const data=await response.json();

  cryptoData=cryptoCoins.map(c=>{

   const info=data[c.id];

   return{

    ...c,

    price:info ? info.usd : null,

    change:info
     ? info.usd_24h_change
     : null

   };

  });

  renderCrypto();

  const btc=cryptoData.find(
   c=>c.symbol==="BTC"
  );

  if(
   btc &&
   document.getElementById("chartSymbol")
   .textContent.includes("BTC")
  ){
   updateHeader(btc);
  }

 }catch(error){

  console.log(
   "Không tải được Crypto",
   error
  );

 }

}


function updateHeader(c){

 document.getElementById(
  "chartSymbol"
 ).textContent=
 c.symbol+" / USDT";

 document.getElementById(
  "chartPrice"
 ).textContent=
 money(c.price);

 const change=
 document.getElementById(
  "chartChange"
 );

 change.textContent=
 percent(c.change);

 change.className=
 "bigchange "+
 (c.change>=0?"green":"red");

}


function selectCrypto(c){

 currentMode="crypto";

 updateHeader(c);

 loadTradingView(c.tv);

 window.scrollTo({
  top:200,
  behavior:"smooth"
 });

}


function selectStock(s){

 document.getElementById(
  "chartSymbol"
 ).textContent=s.symbol;

 document.getElementById(
  "chartPrice"
 ).textContent=
 "Chờ dữ liệu";

 document.getElementById(
  "chartChange"
 ).textContent="--";

 loadTradingView(
  "HOSE:"+s.symbol
 );

 window.scrollTo({
  top:200,
  behavior:"smooth"
 });

}


function loadTradingView(symbol){

 const area=
 document.getElementById(
  "chartArea"
 );

 area.innerHTML="";

 const container=
 document.createElement("div");

 container.className=
 "tradingview-widget-container";

 container.style.height="100%";

 container.style.width="100%";

 const widget=
 document.createElement("div");

 widget.className=
 "tradingview-widget-container__widget";

 widget.style.height="100%";

 widget.style.width="100%";

 const script=
 document.createElement("script");

 script.type=
 "text/javascript";

 script.src=
 "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";

 script.async=true;

 script.innerHTML=
 JSON.stringify({

  autosize:true,

  symbol:symbol,

  interval:"D",

  timezone:"Asia/Ho_Chi_Minh",

  theme:"dark",

  style:"1",

  locale:"vi",

  allow_symbol_change:true,

  calendar:false,

  support_host:
  "https://www.tradingview.com"

 });

 container.appendChild(widget);

 container.appendChild(script);

 area.appendChild(container);

}


function showCrypto(){

 currentMode="crypto";

 document.getElementById(
  "cryptoSection"
 ).classList.remove("hidden");

 document.getElementById(
  "stockSection"
 ).classList.add("hidden");

 document.getElementById(
  "cryptoTab"
 ).classList.add("active");

 document.getElementById(
  "stockTab"
 ).classList.remove("active");

 document.getElementById(
  "search"
 ).placeholder=
 "Tìm Bitcoin, Ethereum, BNB...";

 const btc=
 cryptoData.find(
  c=>c.symbol==="BTC"
 );

 if(btc){
  updateHeader(btc);
 }

 loadTradingView(
  "BINANCE:BTCUSDT"
 );

}


function showStocks(){

 currentMode="stocks";

 document.getElementById(
  "stockSection"
 ).classList.remove("hidden");

 document.getElementById(
  "cryptoSection"
 ).classList.add("hidden");

 document.getElementById(
  "stockTab"
 ).classList.add("active");

 document.getElementById(
  "cryptoTab"
 ).classList.remove("active");

 document.getElementById(
  "search"
 ).placeholder=
 "Tìm FPT, VCB, HPG...";

 document.getElementById(
  "chartSymbol"
 ).textContent=
 "VN-INDEX";

 document.getElementById(
  "chartPrice"
 ).textContent=
 "Chờ dữ liệu";

 document.getElementById(
  "chartChange"
 ).textContent=
 "--";

 loadTradingView(
  "HOSE:VNINDEX"
 );

}


document.getElementById(
 "search"
).addEventListener(
 "input",
 function(){

  const q=
  this.value
  .trim()
  .toUpperCase();

  if(currentMode==="crypto"){

   const filtered=
   cryptoData.filter(c=>

    c.symbol.includes(q)

    ||

    c.name
    .toUpperCase()
    .includes(q)

   );

   const list=
   document.getElementById(
    "cryptoList"
   );

   list.innerHTML="";

   filtered.forEach(c=>{

    const row=
    document.createElement("div");

    row.className="market-row";

    row.innerHTML=`

     <div class="coin-icon">
      ${c.symbol.charAt(0)}
     </div>

     <div>

      <div class="market-symbol">
       ${c.symbol}/USDT
      </div>

      <div class="market-name">
       ${c.name}
      </div>

     </div>

     <div class="market-right">

      <div class="market-price">
       ${money(c.price)}
      </div>

      <div class="market-change ${c.change>=0?"green":"red"}">
       ${percent(c.change)}
      </div>

     </div>

    `;

    row.onclick=
    ()=>selectCrypto(c);

    list.appendChild(row);

   });

  }else{

   const filtered=
   stocks.filter(s=>

    s.symbol.includes(q)

    ||

    s.name
    .toUpperCase()
    .includes(q)

   );

   renderStocks(filtered);

  }

 }
);


renderStocks();

loadTradingView(
 "BINANCE:BTCUSDT"
);

loadCrypto();

setInterval(
 loadCrypto,
 60000
);

</script>

</body>
</html>
