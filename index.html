<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Việt</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  padding:22px 16px 15px;
  border-bottom:1px solid #1c2939;
}
.logo{
  font-size:27px;
  font-weight:800;
}
.logo span{color:#20c997}
.sub{
  color:#8b9bad;
  margin-top:4px;
  font-size:13px;
}
.container{
  padding:15px;
  max-width:900px;
  margin:auto;
}
.tabs{
  display:flex;
  background:#101d2c;
  border-radius:12px;
  padding:4px;
  margin-bottom:15px;
}
.tab{
  flex:1;
  text-align:center;
  padding:11px;
  border-radius:9px;
  color:#8fa0b5;
  font-weight:600;
}
.tab.active{
  background:#1d3045;
  color:white;
}
.market{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:18px;
}
.card{
  background:#101d2c;
  padding:12px;
  border-radius:12px;
}
.symbol{
  font-size:12px;
  color:#9babc0;
}
.price{
  font-weight:700;
  font-size:17px;
  margin-top:5px;
}
.green{color:#20c997}
.red{color:#ff5c6c}

.chartbox{
  background:#101d2c;
  border-radius:15px;
  padding:15px;
  margin-bottom:18px;
}
.charthead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.bigprice{
  font-size:25px;
  font-weight:800;
  margin-top:5px;
}
.timeframes{
  display:flex;
  gap:7px;
  margin:15px 0 5px;
}
.timeframes button{
  border:0;
  background:#18283a;
  color:#9eb0c4;
  padding:7px 12px;
  border-radius:7px;
}
.timeframes .active{
  background:#243c54;
  color:white;
}
#chart{
  height:280px;
  margin-top:10px;
}
.title{
  font-size:17px;
  font-weight:700;
  margin:20px 0 10px;
}
.coin{
  display:flex;
  align-items:center;
  padding:14px 3px;
  border-bottom:1px solid #172638;
  cursor:pointer;
}
.coinlogo{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#18283a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  margin-right:11px;
}
.coinname{
  flex:1;
}
.coinname strong{
  display:block;
}
.coinname small{
  color:#8495aa;
}
.coinprice{
  text-align:right;
}
.coinprice strong{
  display:block;
}
.coinprice small{
  font-weight:600;
}
.search{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #243448;
  background:#0d1928;
  color:white;
  font-size:15px;
  outline:none;
}
.footer{
  text-align:center;
  color:#65778b;
  font-size:12px;
  padding:25px 10px;
}
@media(max-width:500px){
  .market{grid-template-columns:repeat(3,1fr)}
  .price{font-size:14px}
  .card{padding:10px 7px}
}
</style>
</head>

<body>

<header>
<div class="logo">Stock <span>Việt</span></div>
<div class="sub">Thị trường chứng khoán & tài sản số</div>
</header>

<div class="container">

<div class="tabs">
<div class="tab">Chứng khoán</div>
<div class="tab active">Crypto</div>
</div>

<div class="market">
<div class="card">
<div class="symbol">VN-INDEX</div>
<div class="price">1,284.62</div>
<div class="green">+0.49%</div>
</div>

<div class="card">
<div class="symbol">HNX-INDEX</div>
<div class="price">238.41</div>
<div class="green">+0.31%</div>
</div>

<div class="card">
<div class="symbol">UPCOM</div>
<div class="price">94.17</div>
<div class="red">-0.18%</div>
</div>
</div>

<div class="chartbox">
<div class="charthead">
<div>
<div id="chartSymbol"><b>BTC / USDT</b></div>
<div class="bigprice" id="chartPrice">$64,250.00</div>
<div class="green" id="chartChange">+2.45%</div>
</div>
</div>

<div class="timeframes">
<button>1H</button>
<button>4H</button>
<button class="active">1D</button>
<button>1W</button>
</div>

<div class="tradingview-widget-container" style="height:420px;width:100%">
  <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
    "autosize": true,
    "symbol": "BINANCE:BTCUSDT",
    "interval": "D",
    "timezone": "Asia/Ho_Chi_Minh",
    "theme": "dark",
    "style": "1",
    "locale": "vi",
    "allow_symbol_change": true,
    "calendar": false,
    "support_host": "https://www.tradingview.com"
  }
  </script>
</div>
</div>

<input class="search" id="search" placeholder="Tìm Bitcoin, Ethereum, BNB...">

<div class="title">Thị trường Crypto</div>

<div id="coinList"></div>

<div class="footer">
Stock Việt • Theo dõi thị trường
</div>

</div>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const coins = [
  {id:"bitcoin", symbol:"BTC", name:"Bitcoin", price:0, change:0},
  {id:"ethereum", symbol:"ETH", name:"Ethereum", price:0, change:0},
  {id:"binancecoin", symbol:"BNB", name:"BNB", price:0, change:0},
  {id:"solana", symbol:"SOL", name:"Solana", price:0, change:0},
  {id:"ripple", symbol:"XRP", name:"XRP", price:0, change:0},
  {id:"dogecoin", symbol:"DOGE", name:"Dogecoin", price:0, change:0}
];

const coinList = document.getElementById("coinList");

function money(n){
  if(n < 1) return "$" + n.toFixed(3);

  return "$" + n.toLocaleString("en-US",{
    maximumFractionDigits:2
  });
}

function renderCoins(data){
  coinList.innerHTML = "";

  data.forEach(c=>{
    const row = document.createElement("div");
    row.className = "coin";

    row.innerHTML = `
      <div class="coinleft">
        <div class="coinicon">${c.symbol.charAt(0)}</div>
        <div>
          <b>${c.symbol}/USDT</b>
          <span>${c.name}</span>
        </div>
      </div>

      <div class="coinprice">
        <b>${money(c.price)}</b>
        <span class="${c.change >= 0 ? "green" : "red"}">
          ${c.change >= 0 ? "+" : ""}${c.change.toFixed(2)}%
        </span>
      </div>
    `;

    row.onclick = ()=>selectCoin(c);
    coinList.appendChild(row);
  });
}

function updateBigPrice(c){
  document.getElementById("chartSymbol").innerHTML =
    "<b>" + c.symbol + " / USDT</b>";

  document.getElementById("chartPrice").textContent =
    money(c.price);

  const change = document.getElementById("chartChange");

  change.textContent =
    (c.change >= 0 ? "+" : "") +
    c.change.toFixed(2) + "%";

  change.className =
    c.change >= 0 ? "green" : "red";
}

async function updateCryptoPrices(){
  try{
    const ids = coins.map(c=>c.id).join(",");

    const url =
      "https://api.coingecko.com/api/v3/simple/price?ids=" +
      ids +
      "&vs_currencies=usd&include_24hr_change=true";

    const res = await fetch(url);

    if(!res.ok){
      throw new Error("API error");
    }

    const data = await res.json();

    coins.forEach(c=>{
      if(data[c.id]){
        c.price = data[c.id].usd;
        c.change =
          data[c.id].usd_24h_change || 0;
      }
    });

    renderCoins(coins);
    updateBigPrice(coins[0]);

  }catch(error){
    console.log("Không lấy được giá Crypto", error);
  }
}

  function selectCoin(c){
  updateBigPrice(c);

  const symbolMap = {
    BTC: "BINANCE:BTCUSDT",
    ETH: "BINANCE:ETHUSDT",
    BNB: "BINANCE:BNBUSDT",
    SOL: "BINANCE:SOLUSDT",
    XRP: "BINANCE:XRPUSDT",
    DOGE: "BINANCE:DOGEUSDT"
  };

  const widget = document.querySelector(
    ".tradingview-widget-container"
  );

  if(widget){
    widget.innerHTML = `
      <div class="tradingview-widget-container__widget"
           style="height:100%;width:100%"></div>
      <script type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
        async>
      {
        "autosize": true,
        "symbol": "${symbolMap[c.symbol]}",
        "interval": "D",
        "timezone": "Asia/Ho_Chi_Minh",
        "theme": "dark",
        "style": "1",
        "locale": "vi",
        "allow_symbol_change": true,
        "calendar": false
      }
      <\/script>
    `;
  }
}
document.getElementById("search").addEventListener("input",function(){
  const q = this.value.toUpperCase();

  renderCoins(
    coins.filter(c=>
      c.symbol.includes(q) ||
      c.name.toUpperCase().includes(q)
    )
  );
});

renderCoins(coins);
updateCryptoPrices();

setInterval(updateCryptoPrices,60000);
</script>
</body>
</html>
