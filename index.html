<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Việt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#071321;
  color:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:24px;
}

header{
  padding:20px 0 24px;
  border-bottom:1px solid #1d2c3e;
}

.logo{
  font-size:40px;
  font-weight:800;
}

.logo span{color:#4fc59d}

.subtitle{
  color:#8798ac;
  margin-top:7px;
  font-size:18px;
}

.tabs{
  display:flex;
  background:#101e2d;
  padding:6px;
  border-radius:20px;
  margin:28px 0;
}

.tab{
  width:50%;
  border:0;
  padding:16px 8px;
  border-radius:15px;
  background:transparent;
  color:#8999ad;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:#22364f;
  color:white;
}

.indexes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:25px;
}

.index-card{
  background:#111f2f;
  border-radius:18px;
  padding:17px 13px;
}

.index-name{
  color:#91a0b4;
  font-size:14px;
}

.index-price{
  font-size:21px;
  font-weight:750;
  margin-top:7px;
}

.waiting{
  color:#8798ac;
  font-size:13px;
  margin-top:4px;
}

.chart-card{
  background:#111f2f;
  padding:22px;
  border-radius:22px;
  margin-bottom:26px;
}

.chart-symbol{
  font-size:24px;
  font-weight:750;
}

.bigprice{
  font-size:40px;
  font-weight:800;
  margin-top:9px;
}

.bigchange{
  font-size:24px;
  margin-top:5px;
}

.green{color:#42d3a5}
.red{color:#ff6471}
.muted{color:#8798ac}

.timeframes{
  display:flex;
  gap:9px;
  margin:22px 0 14px;
}

.timeframes button{
  border:0;
  background:#17283c;
  color:#98a6b8;
  padding:10px 15px;
  border-radius:11px;
  font-size:16px;
  cursor:pointer;
}

.timeframes button.active{
  background:#304c6d;
  color:white;
}

#chartArea{
  width:100%;
  height:410px;
  overflow:hidden;
}

.search{
  width:100%;
  border:1px solid #31455e;
  background:#091625;
  color:white;
  padding:17px 18px;
  border-radius:17px;
  font-size:18px;
  outline:none;
  margin-bottom:22px;
}

.title{
  font-size:26px;
  font-weight:800;
  margin:14px 0;
}

.market-row{
  display:grid;
  grid-template-columns:65px 1fr auto;
  align-items:center;
  gap:11px;
  padding:20px 5px;
  border-bottom:1px solid #1d3044;
  cursor:pointer;
}

.asset-icon{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#172b42;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
}

.market-symbol{
  font-size:20px;
  font-weight:750;
}

.market-name{
  color:#8c9caf;
  font-size:16px;
  margin-top:4px;
}

.market-right{text-align:right}

.market-price{
  font-size:20px;
  font-weight:750;
}

.market-change{
  margin-top:4px;
  font-size:17px;
}

.hidden{display:none}

.note{
  background:#0d1b2a;
  color:#8798ac;
  border:1px solid #1e3348;
  padding:13px 15px;
  border-radius:14px;
  font-size:14px;
  margin-bottom:10px;
}

.footer{
  text-align:center;
  color:#718297;
  padding:35px 0 50px;
  font-size:14px;
}

@media(max-width:600px){
  .container{padding:18px 15px}
  .logo{font-size:34px}
  .subtitle{font-size:16px}

  .indexes{gap:7px}
  .index-card{padding:14px 9px}
  .index-name{font-size:12px}
  .index-price{font-size:17px}

  .chart-card{padding:17px 12px}
  .bigprice{font-size:35px}

  #chartArea{height:390px}

  .market-row{
    grid-template-columns:52px 1fr auto;
  }

  .asset-icon{
    width:46px;
    height:46px;
    font-size:17px;
  }

  .market-symbol{font-size:17px}
  .market-name{font-size:14px}
  .market-price{font-size:17px}
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">Stock <span>Việt</span></div>
  <div class="subtitle">Thị trường chứng khoán & tài sản số</div>
</header>

<div class="tabs">
  <button id="stockTab" class="tab" onclick="showStocks()">
    Chứng khoán
  </button>

  <button id="cryptoTab" class="tab active" onclick="showCrypto()">
    Crypto
  </button>
</div>

<div class="indexes">
  <div class="index-card">
    <div class="index-name">VN-INDEX</div>
    <div class="index-price">--</div>
    <div class="waiting">Xem biểu đồ</div>
  </div>

  <div class="index-card">
    <div class="index-name">HNX-INDEX</div>
    <div class="index-price">--</div>
    <div class="waiting">Xem biểu đồ</div>
  </div>

  <div class="index-card">
    <div class="index-name">UPCOM</div>
    <div class="index-price">--</div>
    <div class="waiting">Xem biểu đồ</div>
  </div>
</div>

<div class="chart-card">

  <div id="chartSymbol" class="chart-symbol">BTC / USDT</div>
  <div id="chartPrice" class="bigprice">Đang tải...</div>
  <div id="chartChange" class="bigchange muted">--</div>

  <div class="timeframes">
    <button data-interval="60">1H</button>
    <button data-interval="240">4H</button>
    <button data-interval="D" class="active">1D</button>
    <button data-interval="W">1W</button>
  </div>

  <div id="chartArea"></div>
</div>

<input
  id="search"
  class="search"
  placeholder="Tìm Bitcoin, Ethereum..."
>

<div id="cryptoSection">
  <div class="title">Thị trường Crypto</div>
  <div id="cryptoList"></div>
</div>

<div id="stockSection" class="hidden">
  <div class="title">Chứng khoán Việt Nam</div>

  <div class="note">
    Chọn một mã để xem biểu đồ thị trường trên TradingView.
  </div>

  <div id="stockList"></div>
</div>

<div class="footer">
  Stock Việt • Theo dõi thị trường
</div>

</div>

<script>

const cryptoCoins = [
  {id:"bitcoin",symbol:"BTC",name:"Bitcoin",tv:"BINANCE:BTCUSDT"},
  {id:"ethereum",symbol:"ETH",name:"Ethereum",tv:"BINANCE:ETHUSDT"},
  {id:"binancecoin",symbol:"BNB",name:"BNB",tv:"BINANCE:BNBUSDT"},
  {id:"solana",symbol:"SOL",name:"Solana",tv:"BINANCE:SOLUSDT"},
  {id:"ripple",symbol:"XRP",name:"XRP",tv:"BINANCE:XRPUSDT"},
  {id:"dogecoin",symbol:"DOGE",name:"Dogecoin",tv:"BINANCE:DOGEUSDT"}
];

const stocks = [
  {symbol:"FPT",name:"FPT Corporation",tv:"HOSE:FPT"},
  {symbol:"VCB",name:"Vietcombank",tv:"HOSE:VCB"},
  {symbol:"HPG",name:"Hòa Phát",tv:"HOSE:HPG"},
  {symbol:"VIC",name:"Vingroup",tv:"HOSE:VIC"},
  {symbol:"VNM",name:"Vinamilk",tv:"HOSE:VNM"},
  {symbol:"MWG",name:"Thế Giới Di Động",tv:"HOSE:MWG"},
  {symbol:"SSI",name:"Chứng khoán SSI",tv:"HOSE:SSI"},
  {symbol:"VHM",name:"Vinhomes",tv:"HOSE:VHM"}
];

let cryptoData = [];
let currentMode = "crypto";
let currentSymbol = "BINANCE:BTCUSDT";
let currentInterval = "D";

function money(n){
  if(n === null || n === undefined) return "--";

  if(n < 1){
    return "$" + Number(n).toFixed(4);
  }

  return "$" + Number(n).toLocaleString(
    "en-US",
    {maximumFractionDigits:2}
  );
}

function percent(n){
  if(n === null || n === undefined) return "--";

  return (n >= 0 ? "+" : "") +
    Number(n).toFixed(2) + "%";
}

function loadTradingView(symbol){
  currentSymbol = symbol;

  const area = document.getElementById("chartArea");
  area.innerHTML = "";

  const container = document.createElement("div");
  container.className = "tradingview-widget-container";
  container.style.height = "100%";
  container.style.width = "100%";

  const widget = document.createElement("div");
  widget.className = "tradingview-widget-container__widget";
  widget.style.height = "100%";
  widget.style.width = "100%";

  const script = document.createElement("script");
  script.type = "text/javascript";
  script.src =
    "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  script.async = true;

  script.innerHTML = JSON.stringify({
    autosize:true,
    symbol:symbol,
    interval:currentInterval,
    timezone:"Asia/Ho_Chi_Minh",
    theme:"dark",
    style:"1",
    locale:"vi",
    allow_symbol_change:true,
    calendar:false,
    support_host:"https://www.tradingview.com"
  });

  container.appendChild(widget);
  container.appendChild(script);
  area.appendChild(container);
}

function updateCryptoHeader(c){
  document.getElementById("chartSymbol").textContent =
    c.symbol + " / USDT";

  document.getElementById("chartPrice").textContent =
    money(c.price);

  const change = document.getElementById("chartChange");

  change.textContent = percent(c.change);
  change.className =
    "bigchange " + (c.change >= 0 ? "green" : "red");
}

function makeCryptoRow(c){
  const row = document.createElement("div");
  row.className = "market-row";

  row.innerHTML = `
    <div class="asset-icon">${c.symbol.charAt(0)}</div>

    <div>
      <div class="market-symbol">${c.symbol}/USDT</div>
      <div class="market-name">${c.name}</div>
    </div>

    <div class="market-right">
      <div class="market-price">${money(c.price)}</div>
      <div class="market-change ${c.change >= 0 ? "green" : "red"}">
        ${percent(c.change)}
      </div>
    </div>
  `;

  row.onclick = function(){
    updateCryptoHeader(c);
    loadTradingView(c.tv);
  };

  return row;
}

function renderCrypto(data = cryptoData){
  const list = document.getElementById("cryptoList");
  list.innerHTML = "";

  data.forEach(c => {
    list.appendChild(makeCryptoRow(c));
  });
}

function makeStockRow(s){
  const row = document.createElement("div");
  row.className = "market-row";

  row.innerHTML = `
    <div class="asset-icon">${s.symbol.charAt(0)}</div>

    <div>
      <div class="market-symbol">${s.symbol}</div>
      <div class="market-name">${s.name}</div>
    </div>

    <div class="market-right">
      <div class="market-price">Biểu đồ</div>
      <div class="market-name">TradingView</div>
    </div>
  `;

  row.onclick = function(){
    document.getElementById("chartSymbol").textContent =
      s.symbol;

    document.getElementById("chartPrice").textContent =
      s.name;

    const change =
      document.getElementById("chartChange");

    change.textContent = "Chứng khoán Việt Nam";
    change.className = "bigchange muted";

    loadTradingView(s.tv);
  };

  return row;
}

function renderStocks(data = stocks){
  const list = document.getElementById("stockList");
  list.innerHTML = "";

  data.forEach(s => {
    list.appendChild(makeStockRow(s));
  });
}

async function loadCrypto(){
  try{
    const ids =
      cryptoCoins.map(c => c.id).join(",");

    const url =
      "https://api.coingecko.com/api/v3/simple/price" +
      "?ids=" + ids +
      "&vs_currencies=usd" +
      "&include_24hr_change=true";

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Không lấy được dữ liệu");
    }

    const data = await response.json();

    cryptoData = cryptoCoins.map(c => {
      const info = data[c.id];

      return {
        ...c,
        price: info ? info.usd : null,
        change: info ? info.usd_24h_change : null
      };
    });

    renderCrypto();

    if(currentMode === "crypto"){
      const btc =
        cryptoData.find(c => c.symbol === "BTC");

      if(btc &&
         currentSymbol === "BINANCE:BTCUSDT"){
        updateCryptoHeader(btc);
      }
    }

  }catch(error){
    console.log("Không tải được Crypto", error);
  }
}

function showCrypto(){
  currentMode = "crypto";

  document.getElementById("cryptoSection")
    .classList.remove("hidden");

  document.getElementById("stockSection")
    .classList.add("hidden");

  document.getElementById("cryptoTab")
    .classList.add("active");

  document.getElementById("stockTab")
    .classList.remove("active");

  document.getElementById("search").value = "";
  document.getElementById("search").placeholder =
    "Tìm Bitcoin, Ethereum...";

  renderCrypto();

  const btc =
    cryptoData.find(c => c.symbol === "BTC");

  if(btc){
    updateCryptoHeader(btc);
  }else{
    document.getElementById("chartSymbol").textContent =
      "BTC / USDT";

    document.getElementById("chartPrice").textContent =
      "Đang tải...";

    document.getElementById("chartChange").textContent =
      "--";
  }

  loadTradingView("BINANCE:BTCUSDT");
}

function showStocks(){
  currentMode = "stocks";

  document.getElementById("stockSection")
    .classList.remove("hidden");

  document.getElementById("cryptoSection")
    .classList.add("hidden");

  document.getElementById("stockTab")
    .classList.add("active");

  document.getElementById("cryptoTab")
    .classList.remove("active");

  document.getElementById("search").value = "";
  document.getElementById("search").placeholder =
    "Tìm FPT, VCB, HPG...";

  renderStocks();

  document.getElementById("chartSymbol").textContent =
    "VN-INDEX";

  document.getElementById("chartPrice").textContent =
    "Biểu đồ thị trường";

  const change =
    document.getElementById("chartChange");

  change.textContent = "HOSE";
  change.className = "bigchange muted";

  loadTradingView("HOSE:VNINDEX");
}

document.getElementById("search")
.addEventListener("input", function(){

  const q =
    this.value.trim().toUpperCase();

  if(currentMode === "crypto"){

    const filtered =
      cryptoData.filter(c =>
        c.symbol.toUpperCase().includes(q) ||
        c.name.toUpperCase().includes(q)
      );

    renderCrypto(filtered);

  }else{

    const filtered =
      stocks.filter(s =>
        s.symbol.toUpperCase().includes(q) ||
        s.name.toUpperCase().includes(q)
      );

    renderStocks(filtered);
  }
});

document.querySelectorAll(".timeframes button")
.forEach(button => {

  button.addEventListener("click", function(){

    document.querySelectorAll(".timeframes button")
      .forEach(b => b.classList.remove("active"));

    this.classList.add("active");

    currentInterval =
      this.getAttribute("data-interval");

    loadTradingView(currentSymbol);
  });

});

renderStocks();
loadTradingView("BINANCE:BTCUSDT");
loadCrypto();

setInterval(loadCrypto, 60000);

</script>

</body>
</html>
